name: 37club-production

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: "ap-northeast-1"
        awslogs-group: "/37club/production/mysql"
        awslogs-stream: "mysql"
        awslogs-create-group: "false"
        mode: "non-blocking"
        max-buffer-size: "4m"
        cache-max-size: "10m"
        cache-max-file: "3"
        cache-compress: "true"
    env_file:
      - .env.production
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: "ap-northeast-1"
        awslogs-group: "/37club/production/api"
        awslogs-stream: "api"
        awslogs-create-group: "false"
        mode: "non-blocking"
        max-buffer-size: "4m"
        cache-max-size: "10m"
        cache-max-file: "3"
        cache-compress: "true"
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: "ap-northeast-1"
        awslogs-group: "/37club/production/caddy"
        awslogs-stream: "caddy"
        awslogs-create-group: "false"
        mode: "non-blocking"
        max-buffer-size: "4m"
        cache-max-size: "10m"
        cache-max-file: "3"
        cache-compress: "true"
    env_file:
      - .env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
